[package]
name = "spi"
version = "0.4.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
description = "One command line and one config over psp-mint, esp-mint, bitcoind, the AIR server and the SPI wallet."
build = "build.rs"

[dependencies]
# What spi shares with aso: running programs, templating, releases, the upgrade,
# the scheduled upgrade and the logs.
air-minterface = { git = "https://github.com/dav-anderson/air-minterface.git", tag = "v0.3.0" }
# For the unit constants (ESP_PER_PSP) and the claim window
# (CLAIM_WINDOW_SECS): the one place they are defined. v0.7.0 is the wire version
# 5 (the shared keyset ID over every key) that every mint and the wallet speak.
sp-wire = { git = "https://github.com/dav-anderson/sp-wire.git", tag = "v0.7.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Local time for `spi upgrade --at` and its printed time zone (EDT, CET): the
# system zone, and a bundled zone database so a machine without one still works.
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[lib]
name = "spi"
path = "src/lib.rs"

[[bin]]
name = "spi"
path = "src/main.rs"

# For local work, put this in .cargo/config.toml (git-ignored) or uncomment it
# here and do not commit it.
#
# [patch."https://github.com/dav-anderson/sp-wire.git"]
# sp-wire = { path = "../sp-wire" }
