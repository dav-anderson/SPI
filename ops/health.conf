# {{etc_dir}}/{{name}}-health.conf  (root, mode 0644)
# Written once by `spi install`; after that it is yours, and spi never
# overwrites it. Read by sp-health-monitor.sh. An environment variable of the
# same name wins. See the top of the script for what each setting does.
#
# HEALTH_URL, HEALTH_NAME and HEALTH_RESTART_CMD are not here: the service
# definition sets them from spi.toml (the address of the mint, and the command
# that restarts it on this system).
HEALTH_INTERVAL_SECS=30
HEALTH_TIMEOUT_SECS=5
HEALTH_FAILURES=3
HEALTH_GRACE_SECS=60
HEALTH_ACTION=restart
# Optional: run when the mint is unhealthy and when it is back. $HEALTH_MESSAGE has the text.
# HEALTH_REPORT_CMD=logger -t {{name}}-health "$HEALTH_MESSAGE"
